<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: #1a1a2e;
    color: #eaeaea;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    gap: 20px;
  }
  h1 { margin: 0; font-weight: 600; letter-spacing: 1px; }
  #status { font-size: 1.3rem; min-height: 1.5em; }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 8px;
  }
  .cell {
    background: #16213e;
    border: none;
    border-radius: 12px;
    font-size: 3rem;
    font-weight: 700;
    color: #eaeaea;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cell:hover:not(:disabled) { background: #0f3460; }
  .cell.x { color: #e94560; }
  .cell.o { color: #4fd1c5; }
  .cell.win { background: #533483; }
  .cell:disabled { cursor: default; }
  #controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  select, #reset {
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  select {
    background: #0f3460;
    color: #eaeaea;
  }
  #reset {
    background: #e94560;
    color: white;
    padding: 12px 28px;
  }
  #reset:hover, select:hover { opacity: 0.85; }
  .home-link {
    position: fixed;
    top: 14px;
    left: 16px;
    font-size: 0.9rem;
    color: #eaeaea;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(15, 52, 96, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    z-index: 1000;
    transition: background 0.15s, border-color 0.15s;
  }
  .home-link:hover { background: rgba(15, 52, 96, 0.95); border-color: rgba(255, 255, 255, 0.25); }
</style>
</head>
<body>
  <a class="home-link" href="index.html">&larr; All games</a>
  <h1>Tic Tac Toe</h1>
  <div id="status">Player X's turn</div>
  <div id="board"></div>
  <div id="controls">
    <select id="mode">
      <option value="2p">2 Players</option>
      <option value="cpu">vs Computer</option>
    </select>
    <select id="difficulty" style="display:none">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Unbeatable</option>
    </select>
    <button id="reset">New Game</button>
  </div>

<script>
  const board = document.getElementById("board");
  const status = document.getElementById("status");
  const resetBtn = document.getElementById("reset");
  const modeSel = document.getElementById("mode");
  const diffSel = document.getElementById("difficulty");

  const wins = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  const HUMAN = "X", CPU = "O";
  let cells = [];
  let state, current, over;

  function vsComputer() { return modeSel.value === "cpu"; }

  function init() {
    state = Array(9).fill("");
    current = "X";
    over = false;
    board.innerHTML = "";
    cells = [];
    status.textContent = "Player X's turn";
    for (let i = 0; i < 9; i++) {
      const btn = document.createElement("button");
      btn.className = "cell";
      btn.addEventListener("click", () => play(i));
      board.appendChild(btn);
      cells.push(btn);
    }
  }

  function place(i, player) {
    state[i] = player;
    cells[i].textContent = player;
    cells[i].classList.add(player.toLowerCase());
  }

  function play(i) {
    if (over || state[i]) return;
    // In CPU mode, ignore clicks while it's the computer's turn.
    if (vsComputer() && current === CPU) return;

    place(i, current);
    if (finishIfDone()) return;
    current = current === "X" ? "O" : "X";
    status.textContent = `Player ${current}'s turn`;

    if (vsComputer() && current === CPU && !over) {
      // Small delay so the move feels deliberate.
      cells.forEach(c => c.disabled = true);
      setTimeout(computerMove, 350);
    }
  }

  function computerMove() {
    let i;
    if (diffSel.value === "hard") i = bestMove();
    else if (diffSel.value === "medium") i = mediumMove();
    else i = randomMove();
    place(i, CPU);
    cells.forEach(c => c.disabled = !!state[cells.indexOf(c)]);
    if (finishIfDone()) return;
    current = HUMAN;
    status.textContent = `Player ${current}'s turn`;
  }

  // Returns true if the game ended (and updates the UI).
  function finishIfDone() {
    const line = winningLine(state);
    if (line) {
      over = true;
      line.forEach(idx => cells[idx].classList.add("win"));
      const winner = state[line[0]];
      status.textContent = vsComputer()
        ? (winner === HUMAN ? "You win!" : "Computer wins!")
        : `Player ${winner} wins!`;
      cells.forEach(c => c.disabled = true);
      return true;
    }
    if (state.every(v => v)) {
      over = true;
      status.textContent = "It's a draw!";
      return true;
    }
    return false;
  }

  function winningLine(s) {
    return wins.find(([a,b,c]) => s[a] && s[a] === s[b] && s[a] === s[c]);
  }

  function emptyCells(s) {
    return s.map((v, i) => v ? null : i).filter(i => i !== null);
  }

  function randomMove() {
    const avail = emptyCells(state);
    return avail[Math.floor(Math.random() * avail.length)];
  }

  // Find a move that immediately completes three-in-a-row for `player`.
  function winningMoveFor(player) {
    for (const i of emptyCells(state)) {
      state[i] = player;
      const won = winningLine(state);
      state[i] = "";
      if (won) return i;
    }
    return null;
  }

  // Medium: take a win, block the opponent's win, else play randomly.
  // Beatable via forks, but won't miss obvious threats.
  function mediumMove() {
    return winningMoveFor(CPU) ?? winningMoveFor(HUMAN) ?? randomMove();
  }

  // Minimax: the computer (CPU) maximizes, the human minimizes.
  function bestMove() {
    let best = -Infinity, move;
    for (const i of emptyCells(state)) {
      state[i] = CPU;
      const score = minimax(state, false);
      state[i] = "";
      if (score > best) { best = score; move = i; }
    }
    return move;
  }

  function minimax(s, cpuTurn) {
    const line = winningLine(s);
    if (line) return s[line[0]] === CPU ? 10 : -10;
    const avail = emptyCells(s);
    if (avail.length === 0) return 0;

    let best = cpuTurn ? -Infinity : Infinity;
    for (const i of avail) {
      s[i] = cpuTurn ? CPU : HUMAN;
      const score = minimax(s, !cpuTurn);
      s[i] = "";
      best = cpuTurn ? Math.max(best, score) : Math.min(best, score);
    }
    return best;
  }

  modeSel.addEventListener("change", () => {
    diffSel.style.display = vsComputer() ? "" : "none";
    init();
  });
  diffSel.addEventListener("change", init);
  resetBtn.addEventListener("click", init);
  init();
</script>
</body>
</html>
